<!DOCTYPE html> <html lang="ja"> <head> <meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>ぶどうまつり QR受付</title> <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script> <style> * { box-sizing: border-box; } body { margin: 0; padding: 15px; background: #f4f6f9; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; } h1 { font-size: 1.4rem; margin: 10px 0 15px; } #cameraArea { position: relative; width: 100%; max-width: 500px; margin: auto; background: #000; border-radius: 12px; overflow: hidden; } #video { width: 100%; display: block; } #canvas { display: none; } #startButton { width: 100%; max-width: 400px; margin: 15px auto; padding: 16px; border: none; border-radius: 10px; background: #4a6fa5; color: white; font-size: 1.1rem; font-weight: bold; } #message { max-width: 500px; margin: 15px auto; padding: 15px; border-radius: 10px; background: white; font-weight: bold; } .error { background: #fce8e6 !important; color: #c5221f; } .success { background: #e6f4ea !important; color: #137333; } </style> </head> <body> <h1>ぶどうまつり QR受付</h1> <div id="cameraArea">
<video
  id="video"
  autoplay
  playsinline
  muted
></video>

</div>

<canvas id="canvas"></canvas>

<button id="startButton"> カメラを起動 </button> <div id="message"> 「カメラを起動」を押してください。 </div> <script> /* * ★ここをGAS WebアプリURLに変更 */ const GAS_URL = "https://script.google.com/macros/s/AKfycbzlDkxlIY5ljVz5p7Eiepf2_vwtHfidsY7av41cGw0GI4YqKiT6o1bn9lUarZ8y05Gj/exec"; const video = document.getElementById("video"); const canvasElement = document.getElementById("canvas"); const canvas = canvasElement.getContext( "2d", { willReadFrequently: true } ); const startButton = document.getElementById("startButton"); const message = document.getElementById("message"); let stream = null; let scanning = false; let processing = false; /* * カメラ起動 */ async function startCamera() { try { message.className = ""; message.textContent = "カメラを起動しています…"; if ( !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia ) { throw new Error( "このブラウザではカメラ機能を利用できません。" ); } stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } }); video.srcObject = stream; video.setAttribute( "playsinline", "" ); video.setAttribute( "webkit-playsinline", "" ); video.muted = true; await video.play(); startButton.style.display = "none"; message.className = "success"; message.textContent = "QRコードをカメラに映してください。"; scanning = true; requestAnimationFrame(scan); } catch (error) { console.error(error); message.className = "error"; message.innerHTML = "カメラを起動できませんでした。<br><br>" + "エラー：" + escapeHtml(error.name || "") + "<br>" + escapeHtml(error.message || ""); startButton.style.display = "block"; } } /* * QR読み取り */ function scan() { if (!scanning) { return; } if ( video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0 ) { canvasElement.width = video.videoWidth; canvasElement.height = video.videoHeight; canvas.drawImage( video, 0, 0, canvasElement.width, canvasElement.height ); const imageData = canvas.getImageData( 0, 0, canvasElement.width, canvasElement.height ); const code = jsQR( imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" } ); if ( code && code.data && !processing ) { processing = true; scanning = false; message.className = ""; message.textContent = "QRコードを確認しています…"; /* * カメラ停止 */ stopCamera(); /* * GASへ移動 */ const url = GAS_URL + "?code=" + encodeURIComponent( code.data ); window.location.href = url; return; } } requestAnimationFrame(scan); } /* * カメラ停止 */ function stopCamera() { if (stream) { stream .getTracks() .forEach( function(track) { track.stop(); } ); stream = null; } } /* * HTMLエスケープ */ function escapeHtml(value) { return String(value || "") .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } startButton.addEventListener( "click", startCamera ); </script> </body> </html>
