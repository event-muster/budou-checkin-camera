<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ぶどうまつり QR受付</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin: 10px 0 15px;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      display: block;
    }

    #canvas {
      display: none;
    }

    #startButton,
    #nextButton {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #4a6fa5;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }

    #nextButton {
      display: none;
      background: #137333;
    }

    #message {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 10px;
      background: white;
      font-weight: bold;
    }

    .error {
      background: #fce8e6 !important;
      color: #c5221f;
    }

    .success {
      background: #e6f4ea !important;
      color: #137333;
    }

    .loading {
      background: #e8eaed !important;
      color: #3c4043;
    }
  </style>
</head>

<body>

<h1>ぶどうまつり QR受付</h1>

<div id="cameraArea">
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>
</div>

<canvas id="canvas"></canvas>

<button id="startButton">
  カメラを起動
</button>

<button id="nextButton">
  次のQRコードを読み取る
</button>

<div id="message">
  「カメラを起動」を押してください。
</div>


<script>

  // ★★★★★
  // 現在使用しているGASウェブアプリURL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzlDkxlIY5ljVz5p7Eiepf2_vwtHfidsY7av41cGw0GI4YqKiT6o1bn9lUarZ8y05Gj/exec";


  const video =
    document.getElementById("video");

  const canvasElement =
    document.getElementById("canvas");

  const canvas =
    canvasElement.getContext("2d", {
      willReadFrequently: true
    });

  const startButton =
    document.getElementById("startButton");

  const nextButton =
    document.getElementById("nextButton");

  const message =
    document.getElementById("message");


  let stream = null;
  let scanning = false;
  let processing = false;


  // -------------------------
  // カメラ起動
  // -------------------------

  startButton.addEventListener(
    "click",
    startCamera
  );


  nextButton.addEventListener(
    "click",
    function() {

      nextButton.style.display = "none";

      message.className = "loading";
      message.textContent =
        "カメラを準備しています…";

      /*
       * Safariではカメラ停止直後に
       * 再取得すると失敗することがあるため、
       * 少し待ってから起動します。
       */
      setTimeout(function() {
        startCamera();
      }, 800);

    }
  );


  async function startCamera() {

    try {

      scanning = false;
      processing = false;

      message.className = "loading";
      message.textContent =
        "カメラを起動しています…";


      // 古いカメラを完全に停止
      if (stream) {

        stream.getTracks().forEach(
          function(track) {
            track.stop();
          }
        );

        stream = null;
        video.srcObject = null;
      }


      // iPad Safari向け
      await new Promise(
        function(resolve) {
          setTimeout(resolve, 500);
        }
      );


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


      video.srcObject = stream;

      video.setAttribute(
        "playsinline",
        true
      );

      video.muted = true;

      await video.play();


      scanning = true;
      processing = false;

      startButton.style.display = "none";
      nextButton.style.display = "none";

      message.className = "";

      message.textContent =
        "QRコードをカメラに映してください。";


      requestAnimationFrame(scanQR);


    } catch (error) {

      console.error(error);

      message.className = "error";

      message.innerHTML =
        "カメラを起動できませんでした。<br><br>" +
        "エラー：" +
        error.name +
        "<br>" +
        "詳細：" +
        error.message;

      startButton.style.display = "block";
    }

  }


  // -------------------------
  // QR読み取り
  // -------------------------

  function scanQR() {

    if (!scanning) {
      return;
    }


    if (
      video.readyState ===
      video.HAVE_ENOUGH_DATA
    ) {

      canvasElement.width =
        video.videoWidth;

      canvasElement.height =
        video.videoHeight;


      canvas.drawImage(
        video,
        0,
        0,
        canvasElement.width,
        canvasElement.height
      );


      const imageData =
        canvas.getImageData(
          0,
          0,
          canvasElement.width,
          canvasElement.height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data &&
        !processing
      ) {

        processing = true;
        scanning = false;


        const qrData =
          code.data.trim();


        message.className = "loading";

        message.textContent =
          "受付処理中です…";


        // カメラを完全停止
        stopCamera();


        // GASへ送信
        sendToGAS(qrData);

        return;
      }

    }


    requestAnimationFrame(scanQR);

  }


  // -------------------------
  // カメラ停止
  // -------------------------

  function stopCamera() {

    scanning = false;

    if (stream) {

      stream.getTracks().forEach(
        function(track) {
          track.stop();
        }
      );

      stream = null;
    }

    video.srcObject = null;

  }


  // -------------------------
  // GASへ送信
  // -------------------------

  function sendToGAS(qrData) {

    const url =
      GAS_URL +
      "?code=" +
      encodeURIComponent(qrData);


    /*
     * 画面遷移を起こさず、
     * 非表示iframeへGASのURLを読み込ませます。
     */

    const iframe =
      document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src = url;

    document.body.appendChild(iframe);


    // 受付処理を開始したことを画面表示
    message.className = "success";

    message.innerHTML =
      "受付処理を送信しました。<br><br>" +
      "<strong>受付番号：" +
      escapeHtml(qrData) +
      "</strong><br><br>" +
      "スプレッドシートを確認しています…";


    /*
     * 少し待ってから次の受付へ
     */
    setTimeout(
      function() {

        document.body.removeChild(iframe);

        message.className = "success";

        message.innerHTML =
          "受付処理を完了しました。<br><br>" +
          "<strong>受付番号：" +
          escapeHtml(qrData) +
          "</strong>";


        nextButton.style.display =
          "block";

      },
      2500
    );

  }


  // -------------------------
  // HTMLエスケープ
  // -------------------------

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
