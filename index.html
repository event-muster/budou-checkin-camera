<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ぶどうまつり QR受付</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin: 10px 0 15px;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      display: block;
    }

    #canvas {
      display: none;
    }

    #startButton {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #4a6fa5;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }

    #message {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 10px;
      background: white;
      font-weight: bold;
    }

    .error {
      background: #fce8e6 !important;
      color: #c5221f;
    }

    .loading {
      background: #e8eaed !important;
      color: #3c4043;
    }
  </style>
</head>

<body>

<h1>ぶどうまつり QR受付</h1>

<div id="cameraArea">
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>
</div>

<canvas id="canvas"></canvas>

<button id="startButton">
  カメラを起動
</button>

<div id="message">
  「カメラを起動」を押してください。
</div>

<script>

  // ★★★★★
  // ここに現在使用しているGASウェブアプリURLを入れてください
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzlDkxlIY5ljVz5p7Eiepf2_vwtHfidsY7av41cGw0GI4YqKiT6o1bn9lUarZ8y05Gj/exec";

  const video =
    document.getElementById("video");

  const canvasElement =
    document.getElementById("canvas");

  const canvas =
    canvasElement.getContext("2d", {
      willReadFrequently: true
    });

  const startButton =
    document.getElementById("startButton");

  const message =
    document.getElementById("message");

  let stream = null;
  let scanning = false;
  let processing = false;


  // カメラ起動
  startButton.addEventListener(
    "click",
    startCamera
  );


  async function startCamera() {

    try {

      message.className = "loading";
      message.textContent =
        "カメラを起動しています…";

      if (stream) {
        stream
          .getTracks()
          .forEach(track => track.stop());
      }

      stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

      video.srcObject = stream;

      await video.play();

      scanning = true;
      processing = false;

      startButton.style.display = "none";

      message.className = "";
      message.textContent =
        "QRコードをカメラに映してください。";

      requestAnimationFrame(scanQR);

    } catch (error) {

      console.error(error);

      message.className = "error";

      message.innerHTML =
        "カメラを起動できませんでした。<br><br>" +
        "エラー：" + error.name + "<br>" +
        "詳細：" + error.message;

    }
  }


  // QRコード読み取り
  function scanQR() {

    if (!scanning) {
      return;
    }

    if (
      video.readyState ===
      video.HAVE_ENOUGH_DATA
    ) {

      canvasElement.width =
        video.videoWidth;

      canvasElement.height =
        video.videoHeight;

      canvas.drawImage(
        video,
        0,
        0,
        canvasElement.width,
        canvasElement.height
      );

      const imageData =
        canvas.getImageData(
          0,
          0,
          canvasElement.width,
          canvasElement.height
        );

      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts: "attemptBoth"
          }
        );


      if (
        code &&
        code.data &&
        !processing
      ) {

        processing = true;
        scanning = false;

        const qrData =
          code.data.trim();

        message.className = "loading";
        message.textContent =
          "受付処理中です…";

        // カメラを停止
        if (stream) {
  stream.getTracks().forEach(track => {
    track.stop();
  });

  video.srcObject = null;
  stream = null;
}


        /*
         * QRの整理番号をGASへ送る
         *
         * fetchではなく画面遷移を使用します。
         * これによりGitHub Pages → GAS間の
         * 通信制限を回避します。
         */

        const url =
          GAS_URL +
          "?code=" +
          encodeURIComponent(qrData);

        window.location.href = url;
      }
    }

    requestAnimationFrame(scanQR);
  }

</script>

</body>
</html>
