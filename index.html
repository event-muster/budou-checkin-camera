<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ぶどうまつり QR受付</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin: 10px 0 15px;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      display: block;
    }

    #canvas {
      display: none;
    }

    #startButton {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #4a6fa5;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }

    #message {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 10px;
      background: white;
      font-weight: bold;
    }

    .error {
      background: #fce8e6 !important;
      color: #c5221f;
    }

    .success {
      background: #e6f4ea !important;
      color: #137333;
    }

    .warning {
      background: #fef7e0 !important;
      color: #b06000;
    }

    .loading {
      background: #e8eaed !important;
      color: #3c4043;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    .detail-table th,
    .detail-table td {
      padding: 9px;
      border-bottom: 1px solid #eee;
    }

    .detail-table th {
      text-align: left;
      background: #f5f5f5;
    }

    .detail-table td {
      text-align: right;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>ぶどうまつり QR受付</h1>

<div id="cameraArea">
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>
</div>

<canvas id="canvas"></canvas>

<button id="startButton">
  カメラを起動
</button>

<div id="message">
  「カメラを起動」を押してください。
</div>


<script>

  // GASウェブアプリURL
  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbzlDkxlIY5ljVz5p7Eiepf2_vwtHfidsY7av41cGw0GI4YqKiT6o1bn9lUarZ8y05Gj/exec";


  const video =
    document.getElementById("video");

  const canvasElement =
    document.getElementById("canvas");

  const canvas =
    canvasElement.getContext("2d", {
      willReadFrequently: true
    });

  const startButton =
    document.getElementById("startButton");

  const message =
    document.getElementById("message");


  let stream = null;

  let scanning = false;

  let processing = false;


  // =========================
  // カメラ起動
  // =========================

  startButton.addEventListener(
    "click",
    startCamera
  );


  async function startCamera() {

    try {

      message.className = "loading";

      message.textContent =
        "カメラを起動しています…";


      // すでにカメラが動いている場合は何もしない
      if (stream) {

        scanning = true;
        processing = false;

        startButton.style.display =
          "none";

        message.className = "";

        message.textContent =
          "QRコードをカメラに映してください。";

        requestAnimationFrame(scanQR);

        return;
      }


      // カメラはこのページで最初の1回だけ取得
      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


      video.srcObject = stream;

      video.setAttribute(
        "playsinline",
        true
      );

      video.muted = true;

      await video.play();


      scanning = true;

      processing = false;


      startButton.style.display =
        "none";


      message.className = "";

      message.textContent =
        "QRコードをカメラに映してください。";


      requestAnimationFrame(scanQR);


    } catch (error) {

      console.error(error);

      message.className = "error";

      message.innerHTML =
        "カメラを起動できませんでした。<br><br>" +
        "エラー：" +
        error.name +
        "<br>" +
        "詳細：" +
        error.message;

      startButton.style.display =
        "block";
    }

  }


  // =========================
  // QR読み取り
  // =========================

  function scanQR() {

    if (!scanning) {
      return;
    }


    if (
      video.readyState ===
      video.HAVE_ENOUGH_DATA
    ) {

      canvasElement.width =
        video.videoWidth;

      canvasElement.height =
        video.videoHeight;


      canvas.drawImage(
        video,
        0,
        0,
        canvasElement.width,
        canvasElement.height
      );


      const imageData =
        canvas.getImageData(
          0,
          0,
          canvasElement.width,
          canvasElement.height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data &&
        !processing
      ) {

        processing = true;


        const qrData =
          code.data.trim();


        message.className =
          "loading";

        message.textContent =
          "受付処理中です…";


        /*
         * ★重要
         *
         * カメラを停止しません。
         *
         * iPad Safariでは、カメラを停止して
         * getUserMedia()を再実行すると
         * NotAllowedErrorになる場合があるためです。
         */


        sendToGAS(qrData);

        return;
      }

    }


    requestAnimationFrame(scanQR);

  }


  // =========================
  // GASへ送信
  // =========================

  function sendToGAS(qrData) {

  const callbackName =
    "checkInCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  /*
   * GASから返ってきた結果を
   * この関数で受け取ります。
   */
  window[callbackName] =
    function(result) {

      /*
       * scriptを削除
       */
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      /*
       * callbackも削除
       */
      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }


      /*
       * 受付結果を表示
       */
      if (result.alreadyCheckedIn) {

        message.className =
          "warning";

        message.innerHTML =
          "【既に受付済み】<br><br>" +
          escapeHtml(
            result.details
              ? result.details.name
              : "お客様"
          ) +
          " 様は、すでに受付済みです。<br><br>" +
          "次のQRコードを読み取ってください。";


      } else if (result.success) {

        message.className =
          "success";

        message.innerHTML =
          "【受付完了】<br><br>" +
          escapeHtml(
            result.details
              ? result.details.name
              : "お客様"
          ) +
          " 様<br><br>" +
          "受付番号：" +
          escapeHtml(qrData) +
          "<br><br>" +
          "次のQRコードを読み取ってください。";


      } else {

        message.className =
          "error";

        message.innerHTML =
          escapeHtml(
            result.message ||
            "該当する参加者が見つかりません。"
          ) +
          "<br><br>" +
          "次のQRコードを読み取ってください。";
      }


      /*
       * 次のQR読み取りを再開
       */
      setTimeout(
        function() {

          processing = false;
          scanning = true;

          message.className = "";

          message.textContent =
            "次のQRコードを読み取ってください。";

          requestAnimationFrame(
            scanQR
          );

        },
        1000
      );

    };


  /*
   * エラー時
   */
  window[callbackName + "_error"] =
    function() {

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      delete window[callbackName];

      message.className =
        "error";

      message.textContent =
        "受付処理でエラーが発生しました。";

      processing = false;
      scanning = true;

      requestAnimationFrame(
        scanQR
      );
    };


  /*
   * GAS URL
   */
  const url =
    GAS_URL +
    "?code=" +
    encodeURIComponent(qrData) +
    "&callback=" +
    encodeURIComponent(callbackName);


  /*
   * JSONPとしてGASを呼び出す
   */
  script.src = url;


  /*
   * 読み込みエラー
   */
  script.onerror =
    window[callbackName + "_error"];


  document.body.appendChild(script);


  /*
   * 処理中表示
   */
  message.className =
    "loading";

  message.textContent =
    "受付処理中です…";

}



  // =========================
  // HTMLエスケープ
  // =========================

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
</html>
