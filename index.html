<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ぶどうまつり QR受付</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin: 10px 0 15px;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      display: block;
    }

    #canvas {
      display: none;
    }

    #startButton {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #4a6fa5;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }

    #message {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 10px;
      background: white;
      font-weight: bold;
    }

    .error {
      background: #fce8e6 !important;
      color: #c5221f;
    }

    .success {
      background: #e6f4ea !important;
      color: #137333;
    }

    .warning {
      background: #fef7e0 !important;
      color: #b06000;
    }

    .loading {
      background: #e8eaed !important;
      color: #3c4043;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    .detail-table th,
    .detail-table td {
      padding: 9px;
      border-bottom: 1px solid #eee;
    }

    .detail-table th {
      text-align: left;
      background: #f5f5f5;
    }

    .detail-table td {
      text-align: right;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>ぶどうまつり QR受付</h1>

<div id="cameraArea">
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>
</div>

<canvas id="canvas"></canvas>

<button id="startButton">
  カメラを起動
</button>

<div id="message">
  「カメラを起動」を押してください。
</div>


<script>

  // GASウェブアプリURL
  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbzlDkxlIY5ljVz5p7Eiepf2_vwtHfidsY7av41cGw0GI4YqKiT6o1bn9lUarZ8y05Gj/exec";


  const video =
    document.getElementById("video");

  const canvasElement =
    document.getElementById("canvas");

  const canvas =
    canvasElement.getContext("2d", {
      willReadFrequently: true
    });

  const startButton =
    document.getElementById("startButton");

  const message =
    document.getElementById("message");


  let stream = null;

  let scanning = false;

  let processing = false;


  // =========================
  // カメラ起動
  // =========================

  startButton.addEventListener(
    "click",
    startCamera
  );


  async function startCamera() {

    try {

      message.className = "loading";

      message.textContent =
        "カメラを起動しています…";


      // すでにカメラが動いている場合は何もしない
      if (stream) {

        scanning = true;
        processing = false;

        startButton.style.display =
          "none";

        message.className = "";

        message.textContent =
          "QRコードをカメラに映してください。";

        requestAnimationFrame(scanQR);

        return;
      }


      // カメラはこのページで最初の1回だけ取得
      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


      video.srcObject = stream;

      video.setAttribute(
        "playsinline",
        true
      );

      video.muted = true;

      await video.play();


      scanning = true;

      processing = false;


      startButton.style.display =
        "none";


      message.className = "";

      message.textContent =
        "QRコードをカメラに映してください。";


      requestAnimationFrame(scanQR);


    } catch (error) {

      console.error(error);

      message.className = "error";

      message.innerHTML =
        "カメラを起動できませんでした。<br><br>" +
        "エラー：" +
        error.name +
        "<br>" +
        "詳細：" +
        error.message;

      startButton.style.display =
        "block";
    }

  }


  // =========================
  // QR読み取り
  // =========================

  function scanQR() {

    if (!scanning) {
      return;
    }


    if (
      video.readyState ===
      video.HAVE_ENOUGH_DATA
    ) {

      canvasElement.width =
        video.videoWidth;

      canvasElement.height =
        video.videoHeight;


      canvas.drawImage(
        video,
        0,
        0,
        canvasElement.width,
        canvasElement.height
      );


      const imageData =
        canvas.getImageData(
          0,
          0,
          canvasElement.width,
          canvasElement.height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data &&
        !processing
      ) {

        processing = true;


        const qrData =
          code.data.trim();


        message.className =
          "loading";

        message.textContent =
          "受付処理中です…";


        /*
         * ★重要
         *
         * カメラを停止しません。
         *
         * iPad Safariでは、カメラを停止して
         * getUserMedia()を再実行すると
         * NotAllowedErrorになる場合があるためです。
         */


        sendToGAS(qrData);

        return;
      }

    }


    requestAnimationFrame(scanQR);

  }


  // =========================
  // GASへ送信
  // =========================

  function sendToGAS(qrData) {

  const callbackName =
    "checkInCallback_" +
    Date.now();

  const script =
    document.createElement("script");


  /*
   * 受付終了ボタンを作成
   */
  function createFinishButton() {

    let button =
      document.getElementById("finishButton");

    if (!button) {

      button =
        document.createElement("button");

      button.id =
        "finishButton";

      button.textContent =
        "受付終了";

      button.style.display =
        "block";

      button.style.width =
        "100%";

      button.style.maxWidth =
        "400px";

      button.style.margin =
        "10px auto 15px";

      button.style.padding =
        "16px";

      button.style.border =
        "none";

      button.style.borderRadius =
        "10px";

      button.style.background =
        "#b3261e";

      button.style.color =
        "white";

      button.style.fontSize =
        "1.1rem";

      button.style.fontWeight =
        "bold";

      document.body.appendChild(button);


      button.addEventListener(
        "click",
        function() {

          scanning = false;
          processing = true;


          if (stream) {

            stream.getTracks().forEach(
              function(track) {
                track.stop();
              }
            );

            stream = null;
          }


          video.srcObject = null;


          button.style.display =
            "none";


          message.className =
            "success";


          message.innerHTML =
            "<strong>本日の受付は終了しました</strong><br><br>" +
            "最後の受付内容を確認できます。";

        }
      );
    }

    return button;
  }


  /*
   * GASから結果を受け取る
   */
  window[callbackName] =
    function(result) {

      /*
       * script削除
       */
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      /*
       * callback削除
       */
      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }


      /*
       * 受付終了ボタン
       */
      const finishButton =
        createFinishButton();


      /*
       * 受付日時
       *
       * 今回の受付処理が完了した時刻
       */
      const checkInTime =
        new Date();

      const timeText =
        checkInTime.getFullYear() +
        "/" +
        String(
          checkInTime.getMonth() + 1
        ).padStart(2, "0") +
        "/" +
        String(
          checkInTime.getDate()
        ).padStart(2, "0") +
        " " +
        String(
          checkInTime.getHours()
        ).padStart(2, "0") +
        ":" +
        String(
          checkInTime.getMinutes()
        ).padStart(2, "0") +
        ":" +
        String(
          checkInTime.getSeconds()
        ).padStart(2, "0");


      /*
       * 既に受付済み
       */
      if (result.alreadyCheckedIn) {

        message.className =
          "warning";

        let html = "";

        html +=
          "<strong>【既に受付済み】</strong><br><br>";

        html +=
          "<span style='font-size:1.3rem;font-weight:bold;'>" +
          escapeHtml(
            result.details
              ? result.details.name
              : "お客様"
          ) +
          " 様</span><br><br>";

        html +=
          "この受付番号は、すでに受付されています。<br><br>";

        html +=
          "受付番号：" +
          escapeHtml(qrData) +
          "<br><br>";


        /*
         * チケット内容
         */
        if (result.details) {

          html +=
            "<div style='background:#fff;padding:12px;border-radius:8px;text-align:left;'>";

          html +=
            "<strong>受付内容</strong><br><br>";

          html +=
            "有料試飲チケット：" +
            escapeHtml(
              result.details.paidTasting
            ) +
            " 枚<br>";

          html +=
            "追加試飲チケット：" +
            escapeHtml(
              result.details.extraTasting
            ) +
            " 枚<br>";

          html +=
            "有料指定席：" +
            escapeHtml(
              result.details.reservedSeat
            ) +
            " 席<br>";

          html +=
            "有料指定席夕方：" +
            escapeHtml(
              result.details.reservedSeatEvening
            ) +
            " 席<br>";

          html +=
            "軽食：" +
            escapeHtml(
              result.details.snack
            ) +
            " 個";

          html +=
            "</div>";
        }


        html +=
          "<br>次のQRコードを読み取ってください。";

        message.innerHTML =
          html;


      /*
       * 新規受付完了
       */
      } else if (result.success) {

        message.className =
          "success";

        let html = "";

        html +=
          "<strong>【受付完了】</strong><br><br>";

        html +=
          "<span style='font-size:1.4rem;font-weight:bold;'>" +
          escapeHtml(
            result.details
              ? result.details.name
              : "お客様"
          ) +
          " 様</span><br><br>";

        html +=
          "受付番号：" +
          escapeHtml(qrData) +
          "<br><br>";


        /*
         * 受付内容
         */
        if (result.details) {

          html +=
            "<div style='background:#fff;padding:15px;border-radius:10px;text-align:left;'>";

          html +=
            "<strong>受付内容</strong><br><br>";

          html +=
            "有料試飲チケット：" +
            escapeHtml(
              result.details.paidTasting
            ) +
            " 枚<br>";

          html +=
            "追加試飲チケット：" +
            escapeHtml(
              result.details.extraTasting
            ) +
            " 枚<br>";

          html +=
            "有料指定席：" +
            escapeHtml(
              result.details.reservedSeat
            ) +
            " 席<br>";

          html +=
            "有料指定席夕方：" +
            escapeHtml(
              result.details.reservedSeatEvening
            ) +
            " 席<br>";

          html +=
            "軽食：" +
            escapeHtml(
              result.details.snack
            ) +
            " 個<br><br>";

          html +=
            "<strong>受付日時：</strong>" +
            timeText;

          html +=
            "</div>";
        }


        html +=
          "<br><strong>次のQRコードを読み取れます。</strong>";

        message.innerHTML =
          html;


      /*
       * エラー
       */
      } else {

        message.className =
          "error";

        message.innerHTML =
          "<strong>【受付エラー】</strong><br><br>" +
          escapeHtml(
            result.message ||
            "該当する参加者が見つかりません。"
          ) +
          "<br><br>" +
          "次のQRコードを読み取ってください。";
      }


      /*
       * 受付終了ボタンを表示
       */
      finishButton.style.display =
        "block";


      /*
       * 次のQR読み取りを再開
       */
      setTimeout(
        function() {

          processing = false;
          scanning = true;

          requestAnimationFrame(
            scanQR
          );

        },
        1000
      );

    };


  /*
   * エラー時
   */
  window[callbackName + "_error"] =
    function() {

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      delete window[callbackName];

      message.className =
        "error";

      message.textContent =
        "受付処理でエラーが発生しました。";

      processing = false;
      scanning = true;

      requestAnimationFrame(
        scanQR
      );
    };


  /*
   * GAS URL
   */
  const url =
    GAS_URL +
    "?code=" +
    encodeURIComponent(qrData) +
    "&callback=" +
    encodeURIComponent(callbackName);


  /*
   * JSONPとしてGASを呼び出す
   */
  script.src = url;


  /*
   * 読み込みエラー
   */
  script.onerror =
    window[callbackName + "_error"];


  document.body.appendChild(script);


  /*
   * 処理中表示
   */
  message.className =
    "loading";

  message.textContent =
    "受付処理中です…";

}



  // =========================
  // HTMLエスケープ
  // =========================

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
</html>
